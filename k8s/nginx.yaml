apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels: { app: nginx }
spec:
  containers:
    - name: nginx
      image: nginx:1.28
      ports: [{ containerPort: 80 }]
    - name: checker
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -qO- localhost:80 | grep -o '<title>.*</title>'; sleep 10; done"] }]

