# Account the Jenkins and Azure pipelines use to deploy into namespace "apps".
apiVersion: v1
kind: Namespace
metadata: { name: apps }
---
apiVersion: v1
kind: Namespace
metadata: { name: jenkins-agents }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: jenkins, namespace: jenkins-agents }
---
# Long-lived token for that account (shortcut: never expires; for real clusters use short tokens + rotation).
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-token
  namespace: jenkins-agents
  annotations: { kubernetes.io/service-account.name: jenkins }
type: kubernetes.io/service-account-token
---
# "edit" rights in apps only, same as on the kind cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: jenkins-deployer, namespace: apps }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit }
subjects:
  - { kind: ServiceAccount, name: jenkins, namespace: jenkins-agents }
