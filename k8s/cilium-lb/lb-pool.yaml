# Addresses Cilium may hand to LoadBalancer services (free block on the home LAN).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata: { name: home-lan }
spec:
  blocks:
    - cidr: 192.168.29.240/29
---
# Answer ARP for those addresses on the LAN card only, so the Mac can reach them.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata: { name: home-lan }
spec:
  interfaces: ["^enp0s3$"]
  loadBalancerIPs: true
